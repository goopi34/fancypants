name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# GitHub runners ship both docker and podman; podman there is rootless, which
# breaks host ownership of files written by build containers. Pin docker.
env:
  CONTAINER: docker

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub Release and upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Run tests
        run: make test

      - name: Build firmware
        run: make firmware VERSION="$VERSION"

      - name: Build middleware
        run: make middleware VERSION="$VERSION"

      - name: Package artifacts
        run: |
          mkdir -p dist
          # Firmware: a bare UF2, ready to drag onto the FTHR840BOOT drive
          cp build/firmware/zephyr.uf2 "dist/fancypants-nrf52-${VERSION}.uf2"
          # Middleware: binary + documented sample config, so extracting the
          # tarball and running ./fancypants just works
          staging="fancypants-${VERSION}-linux-x86_64"
          mkdir "dist/$staging"
          cp build/middleware/fancypants "dist/$staging/"
          cp config.toml README.md LICENSE "dist/$staging/"
          cp -r docs "dist/$staging/docs"
          tar -C dist -czf "dist/$staging.tar.gz" "$staging"
          rm -r "dist/$staging"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.uf2 dist/*.tar.gz

