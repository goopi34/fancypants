name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Run tests
        run: make test

      - name: Build firmware
        run: make firmware VERSION="$VERSION"

      - name: Build middleware
        run: make middleware VERSION="$VERSION"

      - name: Package artifacts
        run: |
          mkdir -p dist
          # Firmware: a bare UF2, ready to drag onto the FTHR840BOOT drive
          cp build/firmware/zephyr.uf2 "dist/fancypants-nrf52-${VERSION}.uf2"
          # Middleware: binary + documented sample config, so extracting the
          # tarball and running ./fancypants just works
          staging="fancypants-${VERSION}-linux-x86_64"
          mkdir "dist/$staging"
          cp build/middleware/fancypants "dist/$staging/"
          cp config.toml README.md LICENSE "dist/$staging/"
          cp -r docs "dist/$staging/docs"
          tar -C dist -czf "dist/$staging.tar.gz" "$staging"
          rm -r "dist/$staging"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.uf2
            dist/*.tar.gz
          generate_release_notes: true
