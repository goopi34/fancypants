[package]
name = "fancypants-app"
version = "0.3.0"
edition = "2021"
description = "Fancypants Desktop & Mobile Tauri v2 Application"
license = "MIT"

[lib]
name = "fancypants_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fancypants = { path = "../../middleware" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.19"
jni-utils = "0.1"
btleplug = "0.11"

